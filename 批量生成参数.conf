# Mac Live Photo 随机组合批量工具 v1.0
# 只修改等号右边的数字，不要加百分号。

# 每张图生成几个不重复的视频，可设1～35。
VIDEOS_PER_IMAGE=2

# 1=同时生成苹果原生 Live Photo 配对文件；0=只生成MP4。
GENERATE_LIVE_PHOTO=1
# 1=自动导入Mac“照片”App；0=只保留JPG+MOV配对文件。
AUTO_IMPORT_TO_PHOTOS=1
# 1=保留普通MP4；0=Live Photo成功后删除对应MP4。
KEEP_MP4=1

DURATION=3
FPS=30
# 最终视频清晰度：数字越小越清晰、文件越大，建议12～18。
QUALITY=14
SUPERSAMPLE=2

# 五种形变参数，保留已确认的组合实验数值。
VERTICAL_STRETCH_PERCENT=0.5
HORIZONTAL_STRETCH_PERCENT=0.5
SHEAR_PERCENT=0.8
ROLL_DEGREES=0.25
LENS_BREATHING=0.012
